name: bio_app
description: Ứng dụng quản lý quy trình canh tác cho nông dân
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Forms & Validation
  intl: ^0.18.1
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Image & File Picker
  image_picker: ^1.0.5
  file_picker: ^10.0.0
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # PDF Generation
  pdf: ^3.10.6
  printing: ^5.11.1
  
  # Storage & Database
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Utilities
  uuid: ^4.2.1
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"
  remove_alpha_ios: true
